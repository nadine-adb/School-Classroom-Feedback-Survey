<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluation Responses</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-image: url('notebook.jpg');
        background-position: center;
        background-size: cover;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('notebook.jpg');
        background-size: cover;
        background-position: center;
        filter: blur(5px);
        z-index: -1;
    }

    .container {
        background-color: #f8f1e4;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); 
        width: 95%;
        max-width: 1200px;
        margin: 30px auto;
        animation: fadeIn 1.5s ease-in-out;
    }

    .inner-container {
        background: #fffaf0;
        padding: 20px;
        border: 2px solid #000;
        border-radius: 10px;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 1.8em;
        color: #333;
        margin-bottom: 10px;
    }

    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 20px;
        padding: 15px;
        background-color: #f0e6d2;
        border-radius: 8px;
    }

    .filter-group {
        flex: 1;
        min-width: 200px;
    }

    .filter-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }

    .filter-group select, .filter-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .table-container {
        overflow-x: auto;
        margin-top: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background: #fffaf0;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    th, td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #d2b48c;
        color: black;
        font-weight: bold;
        position: sticky;
        top: 0;
    }

    tr:hover {
        background-color: #f9e4c8;
        transition: background-color 0.3s ease;
    }

    .star-rating {
        color: gold;
        font-size: 1.2em;
    }

    .empty-stars {
        color: #ccc;
    }

    .subject-section {
        margin-bottom: 30px;
        border: 1px solid #d2b48c;
        border-radius: 8px;
        overflow: hidden;
    }

    .subject-header {
        background-color: #d2b48c;
        padding: 10px 15px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .subject-name {
        font-size: 1.2em;
    }

    .subject-stats {
        font-size: 0.9em;
    }

    .button-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .action-button {
        padding: 10px 15px;
        font-size: 1em;
        background-color: #d2b48c;
        color: black;
        border: none;
        border-radius: 5px;
        margin: 0 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .action-button:hover {
        background-color: #c0a08c;
        transform: scale(1.05);
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeIn {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
    }

    .no-data {
        text-align: center;
        padding: 30px;
        font-style: italic;
        color: #666;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .container {
            width: 95%;
            padding: 15px;
        }
        
        .filters {
            flex-direction: column;
        }
        
        th, td {
            padding: 8px 10px;
            font-size: 0.9em;
        }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="inner-container">
      <div class="header">
        <h1>Teacher Evaluation Responses</h1>
        <p>View and filter evaluation results by subject, teacher, and rating</p>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label for="subject-filter">Filter by Subject:</label>
          <select id="subject-filter">
            <option value="all">All Subjects</option>
            <!-- Will be populated dynamically -->
          </select>
        </div>
        
        <div class="filter-group">
          <label for="teacher-filter">Filter by Teacher:</label>
          <select id="teacher-filter">
            <option value="all">All Teachers</option>
            <!-- Will be populated dynamically -->
          </select>
        </div>
        
        <div class="filter-group">
          <label for="rating-filter">Filter by Rating:</label>
          <select id="rating-filter">
            <option value="all">All Ratings</option>
            <option value="5">5 Stars</option>
            <option value="4">4 Stars</option>
            <option value="3">3 Stars</option>
            <option value="2">2 Stars</option>
            <option value="1">1 Star</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="search-input">Search:</label>
          <input type="text" id="search-input" placeholder="Search...">
        </div>
      </div>

      <div id="responses-container">
        <!-- subject sections will be generated here -->
      </div>

      <div class="button-container">
        <button class="action-button" id="sort-rating-high">Sort by Highest Rating</button>
        <button class="action-button" id="sort-rating-low">Sort by Lowest Rating</button>
        <button class="action-button" id="clear-data">Clear All Data</button>
        <a href="index.html"><button class="action-button">Back to Home</button></a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // get evaluation data from localStorage
      function getEvaluationData() {
        return JSON.parse(localStorage.getItem('teacherEvaluations')) || [];
      }

      // function to render star ratings
      function renderStars(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
          if (i <= rating) {
            stars += '★';
          } else {
            stars += '☆';
          }
        }
        return `<span class="star-rating">${stars}</span>`;
      }

      // function to group evaluations by subject
      function groupBySubject(data) {
        const grouped = {};
        data.forEach(item => {
          if (!grouped[item.subject]) {
            grouped[item.subject] = [];
          }
          grouped[item.subject].push(item);
        });
        return grouped;
      }

      // function to calculate average rating for a subject
      function calculateAverageRating(evaluations) {
        if (evaluations.length === 0) return 0;
        const sum = evaluations.reduce((total, item) => total + parseInt(item.teacher_rating), 0);
        return (sum / evaluations.length).toFixed(1);
      }

     
      function renderEvaluations(data) {
        const container = document.getElementById('responses-container');
        container.innerHTML = '';
        
        if (data.length === 0) {
          container.innerHTML = '<div class="no-data">No evaluation data found. Please wait for students to submit evaluations.</div>';
          return;
        }
        
        const groupedData = groupBySubject(data);
        
        // sort subjects alphabetically
        const sortedSubjects = Object.keys(groupedData).sort();
        
        sortedSubjects.forEach(subject => {
          const evaluations = groupedData[subject];
          const avgRating = calculateAverageRating(evaluations);
          
          const subjectSection = document.createElement('div');
          subjectSection.className = 'subject-section';
          
          subjectSection.innerHTML = `
            <div class="subject-header">
              <div class="subject-name">${subject}</div>
              <div class="subject-stats">Average Rating: ${avgRating} | Total Evaluations: ${evaluations.length}</div>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Grade & Section</th>
                    <th>Teacher</th>
                    <th>Rating</th>
                    <th>Engagement</th>
                    <th>Knowledge</th>
                    <th>Organization</th>
                    <th>Feedback</th>
                    <th>Participation</th>
                    <th>Comments</th>
                  </tr>
                </thead>
                <tbody>
                  ${evaluations.map(item => `
                    <tr>
                      <td>${item.student_name}</td>
                      <td>${item.grade_section}</td>
                      <td>${item.teacher_name}</td>
                      <td>${renderStars(item.teacher_rating)}</td>
                      <td>${item.engagement}</td>
                      <td>${item.knowledge}</td>
                      <td>${item.organization}</td>
                      <td>${item.feedback}</td>
                      <td>${item.participation}</td>
                      <td>${item.comments || '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
          
          container.appendChild(subjectSection);
        });
      }


      function initializeFilters(data) {
        const subjectFilter = document.getElementById('subject-filter');
        const teacherFilter = document.getElementById('teacher-filter');
   
        while (subjectFilter.options.length > 1) {
          subjectFilter.remove(1);
        }
        
        while (teacherFilter.options.length > 1) {
          teacherFilter.remove(1);
        }
        

        const subjects = [...new Set(data.map(item => item.subject))].sort();
        subjects.forEach(subject => {
          const option = document.createElement('option');
          option.value = subject;
          option.textContent = subject;
          subjectFilter.appendChild(option);
        });
        
        
        const teachers = [...new Set(data.map(item => item.teacher_name))].sort();
        teachers.forEach(teacher => {
          const option = document.createElement('option');
          option.value = teacher;
          option.textContent = teacher;
          teacherFilter.appendChild(option);
        });
      }


      function applyFilters() {
        const subjectValue = document.getElementById('subject-filter').value;
        const teacherValue = document.getElementById('teacher-filter').value;
        const ratingValue = document.getElementById('rating-filter').value;
        const searchValue = document.getElementById('search-input').value.toLowerCase();
        
        let filteredData = getEvaluationData();
        
        if (subjectValue !== 'all') {
          filteredData = filteredData.filter(item => item.subject === subjectValue);
        }
        
        if (teacherValue !== 'all') {
          filteredData = filteredData.filter(item => item.teacher_name === teacherValue);
        }
        
        if (ratingValue !== 'all') {
          filteredData = filteredData.filter(item => parseInt(item.teacher_rating) === parseInt(ratingValue));
        }
        
        if (searchValue) {
          filteredData = filteredData.filter(item => 
            (item.subject && item.subject.toLowerCase().includes(searchValue)) ||
            (item.teacher_name && item.teacher_name.toLowerCase().includes(searchValue)) ||
            (item.grade_section && item.grade_section.toLowerCase().includes(searchValue)) ||
            (item.comments && item.comments.toLowerCase().includes(searchValue)) ||
            (item.student_name && item.student_name.toLowerCase().includes(searchValue))
          );
        }
        
        renderEvaluations(filteredData);
      }

      // sort by rating
      function sortByRating(highToLow = true) {
        const container = document.getElementById('responses-container');
        const sections = Array.from(container.querySelectorAll('.subject-section'));
        
        sections.sort((a, b) => {
          const ratingA = parseFloat(a.querySelector('.subject-stats').textContent.match(/Average Rating: ([\d.]+)/)[1]);
          const ratingB = parseFloat(b.querySelector('.subject-stats').textContent.match(/Average Rating: ([\d.]+)/)[1]);
          
          return highToLow ? ratingB - ratingA : ratingA - ratingB;
        });
        
        container.innerHTML = '';
        sections.forEach(section => container.appendChild(section));
      }

      // Clear all data
      function clearData() {
        if (confirm('Are you sure you want to clear all evaluation data? This action cannot be undone.')) {
          localStorage.removeItem('teacherEvaluations');
          renderEvaluations([]);
          initializeFilters([]);
        }
      }

     
      const evaluationData = getEvaluationData();
      initializeFilters(evaluationData);
      renderEvaluations(evaluationData);
      

      document.getElementById('subject-filter').addEventListener('change', applyFilters);
      document.getElementById('teacher-filter').addEventListener('change', applyFilters);
      document.getElementById('rating-filter').addEventListener('change', applyFilters);
      document.getElementById('search-input').addEventListener('input', applyFilters);
      document.getElementById('sort-rating-high').addEventListener('click', () => sortByRating(true));
      document.getElementById('sort-rating-low').addEventListener('click', () => sortByRating(false));
      document.getElementById('clear-data').addEventListener('click', clearData);
    });
  </script>
</body>
</html>
